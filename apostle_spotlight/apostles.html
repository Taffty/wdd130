<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .center {
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers .top-row and .main-grid horizontally */
            gap: 30px;
            max-width: 1000px;
            width: 100%;
            position: relative;
        }

        .bmg {
            position: absolute;
            border-radius: 5%;
            inset: 0;
            z-index: 0;
            max-width: 900px;
            width: 100%;
            max-height: 900px;
            height: 100%;
            margin: auto;
            border: 10px solid #0d0d0e;
            overflow: hidden;
        }

        .bmg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .top-row {
            display: flex;
            justify-content: center; /* Centers top row items horizontally */
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            z-index: 10;
        }

        .top-row img,
        .main-grid img {
            object-fit: cover;
            border-radius: 50%;
            width: 130px;
            height: 130px;
            border: 4px solid white;
            display: block;
        }

        .top-row .photo-card:nth-child(2) img {
            width: 150px;
            height: 150px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 equal columns */
            justify-items: center; /* Centers each image inside its grid cell */
            align-items: center;
            gap: 10px;
            width: 100%;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="center">
        <!-- Moved background div inside body/center container -->
        <div class="bmg">
            <img src="images/christus.webp" alt="Christus">
        </div>

        <div class="top-row">
            <img src="images/eyring.webp" alt="Eyring">
            <img src="images/oaks.webp" alt="Oaks">
            <img src="images/christofferson.webp" alt="Christofferson">
        </div>

        <!-- Grid children are directly under .main-grid -->
        <div class="main-grid">
            <img src="images/uchtdorf.webp" alt="Uchtdorf">
            <img src="images/bednar.webp" alt="Bednar">
            <img src="images/cook.webp" alt="Cook">
            <img src="images/anderson.webp" alt="Andersen">
            <img src="images/rasband.webp" alt="Rasband">
            <img src="images/stevenson.webp" alt="Stevenson">
            <img src="images/renlund.webp" alt="Renlund">
            <img src="images/gong.webp" alt="Gong">
            <img src="images/soares.webp" alt="Soares">
            <img src="images/kearon.webp" alt="Kearon">
            <img src="images/causse.webp" alt="Causse">
            <img src="images/gilbert.webp" alt="Gilbert">
        </div>
    </div>
</body>
</html>
