<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        :root {
        --heading-font: Helvetica, Arial, sans-serif;
        --paragraph-font: Helvetica, Arial, sans-serif;
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            background: #FFECD7;
            display: grid;
            justify-items: center;
            align-items: center;
            margin: auto auto;
            text-align: center;
            height: 100vh;
            
        }
        .card {
            border: 5px black;
            background-color: #008db1;
            max-width: 390px;
        }
        h1 {
            color: #FFFFFE;
        }
        h2 {
            color: #91e4fb;
        }
        img {
            border: 5px solid #fffffe;
            max-width: 240px;
        }
        .bullets {
            color: #FFFFFE;
            display: list-item;
            list-style-type: disc;
            list-style-position: inside;
            text-align: left;
        }
        .bullet_space {
            text-align: center;
        }

    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
     <div class="card">
        <h1>Dallin H. Oaks</h1>
        <h2>18th President of the Church of Jesus Christ of Latter-Day Saints</h2>
        <img src="images/oaks.webp" alt="">
        <ul class="bullet_space">
            <div class="bullets">
            <li>Born: Aug 12, 1932</li>
            <li>Apr 7, 1984</li>
            <li>Prophet: Oct 14,2025</li>
            </div>
        </ul>
        </div>
        
     </div>
     
</body>
</html>
